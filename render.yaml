services:
  - type: web
    name: resqnet-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: resqnet-db
          property: connectionString

databases:
  - name: resqnet-db
    plan: free
    databaseName: resqnet
    user: postgres
